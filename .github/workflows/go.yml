name: Go CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & Test
    runs-on: moss
    # Only run on the moss runner (Strix Halo target hardware)
    if: ${{ github.repository == 'emanspeaks/amdgpu-go' }}
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Verify libdrm
        run: |
          pkg-config --modversion libdrm
          pkg-config --modversion libdrm_amdgpu || echo "libdrm_amdgpu.pc not found (may be bundled)"

      - name: Build
        run: CGO_ENABLED=1 go build ./...

      - name: Vet
        run: CGO_ENABLED=1 go vet ./...

      - name: Test (build verification)
        run: CGO_ENABLED=0 go test -v ./...
