name: Go CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & Test
    runs-on: moss
    # Only run on the moss runner (Strix Halo target hardware)
    if: ${{ github.repository == 'emanspeaks/amdgpu-go' }}
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Install libdrm dependencies
        run: |
          # On NixOS, nix-shell doesn't need sudo
          nix-shell -p libdrm pkgconfig libdrm_amdgpu --run "true"
          # Verify pkg-config can find libdrm
          pkg-config --modversion libdrm || echo "libdrm not found via pkg-config"

      - name: Set CGO environment
        run: |
          # On NixOS, we need to set CGO flags to find libraries
          echo "CGO_ENABLED=1" >> $GITHUB_ENV
          echo "CGO_CFLAGS=$(pkg-config --cflags libdrm libdrm_amdgpu)" >> $GITHUB_ENV
          echo "CGO_LDFLAGS=$(pkg-config --libs libdrm libdrm_amdgpu)" >> $GITHUB_ENV
          echo "PKG_CONFIG_PATH=$(pkg-config --variable=pc_path pkg-config)" >> $GITHUB_ENV

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test (no GPU)
        run: CGO_ENABLED=0 go test -v ./...

      - name: Test (with GPU)
        run: CGO_ENABLED=1 go test -v -tags=cgo ./...
        # This step will skip tests that require GPU hardware
        # The TestOpenSkip test uses t.Skip() when no GPU is available
