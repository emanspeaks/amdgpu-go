name: Go CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & Test
    runs-on: moss
    # Only run on the moss runner (Strix Halo target hardware)
    if: ${{ github.repository == 'emanspeaks/amdgpu-go' }}
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Check libdrm dependencies
        run: |
          # Check if libdrm is available via pkg-config
          if pkg-config --exists libdrm 2>/dev/null; then
            echo "libdrm already available"
            pkg-config --modversion libdrm
          else
            echo "libdrm not found — check runner has libdrm in its Nix profile"
            exit 1
          fi

      - name: Set CGO environment
        run: |
          # Set CGO flags for libdrm
          echo "CGO_ENABLED=1" >> $GITHUB_ENV
          echo "CGO_CFLAGS=$(pkg-config --cflags libdrm libdrm_amdgpu)" >> $GITHUB_ENV
          echo "CGO_LDFLAGS=$(pkg-config --libs libdrm libdrm_amdgpu)" >> $GITHUB_ENV

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test (no GPU)
        run: CGO_ENABLED=0 go test -v ./...

      - name: Test (with GPU)
        run: CGO_ENABLED=1 go test -v -tags=cgo ./...
        # This step will skip tests that require GPU hardware
        # The TestOpenSkip test uses t.Skip() when no GPU is available
